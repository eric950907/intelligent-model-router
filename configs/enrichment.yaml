    capabilities: { tools: true, json_mode: true }
    context_window: 256000
  glm-5.2:
    vendor: zhipu
    description: 均衡通用;中文强;性价比好。
    tags: [chat, code, zh_strong, tools]
    capabilities: { tools: true, json_mode: true }
    context_window: 200000
  private-ai/qwen3.5-35B-A3B-V2:
    vendor: alibaba

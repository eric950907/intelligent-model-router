<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Recommender Debug</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#2563eb; --brand-2:#1d4ed8; --brand-soft:#eff6ff;
  --ok:#059669; --ok-soft:#ecfdf5; --warn:#d97706; --warn-soft:#fffbeb; --bad:#dc2626; --bad-soft:#fef2f2;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --panel:#111a2e; --ink:#e2e8f0; --muted:#94a3b8; --line:#1e293b;
    --brand:#60a5fa; --brand-2:#3b82f6; --brand-soft:#172554;
    --ok-soft:#052e22; --warn-soft:#3b2605; --bad-soft:#3f1212;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;
  font-size:14px; line-height:1.55;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}

.topbar{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 24px;
  background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.logo{
  width:38px;height:38px;border-radius:11px;flex:none;
  display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  box-shadow:0 6px 16px rgba(59,130,246,.35);
}
.brand h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.brand p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:10px;flex:none}

.layout{
  display:grid; grid-template-columns:minmax(360px,480px) minmax(0,1fr);
  gap:20px; padding:20px 24px 40px; max-width:1560px; margin:0 auto;
}
@media (max-width:980px){ .layout{grid-template-columns:1fr; padding:16px} .topbar{padding:12px 16px} }

.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px; min-width:0;
}
.request-panel{position:sticky; top:78px; align-self:start; max-height:calc(100vh - 96px); overflow:auto}
@media (max-width:980px){ .request-panel{position:static; max-height:none} }
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel-head h2{font-size:14px;margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);font-weight:700}

.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line); background:transparent; color:var(--muted);
  padding:4px 10px; border-radius:999px; cursor:pointer; font-size:12px;
  transition:all .15s ease;
}
.chip:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

.field-label{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 6px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
textarea{
  width:100%; min-height:250px; resize:vertical;
  background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:12px; font-family:var(--mono); font-size:12.5px; line-height:1.6;
  outline:none; transition:border-color .15s ease, box-shadow .15s ease;
}
textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
.field input[type=text],.field input[type=number],.field input[type=password],.field select{
  width:100%; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:8px 10px; outline:none; font-weight:400; color:var(--ink);
}
.field input:focus,.field select:focus{border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.field.checkbox{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);margin-top:12px}
.field.checkbox input{width:16px;height:16px;accent-color:var(--brand)}

.section{border:1px solid var(--line); border-radius:var(--radius-sm); padding:2px 12px 12px; margin-top:14px; background:color-mix(in srgb,var(--bg) 55%,transparent)}
.section summary{cursor:pointer; padding:9px 0 6px; font-size:12px; font-weight:700; color:var(--ink); letter-spacing:.02em; list-style:none}
.section summary::-webkit-details-marker{display:none}
.section summary::before{content:"▸"; display:inline-block; margin-right:7px; color:var(--muted); transition:transform .15s}
.section[open] summary::before{transform:rotate(90deg)}

.actions{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-primary{
  border:0; background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff;
  padding:10px 22px; border-radius:10px; font-weight:700; cursor:pointer;
  box-shadow:0 6px 16px rgba(37,99,235,.28); transition:transform .12s ease, box-shadow .12s ease, opacity .12s;
}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 10px 22px rgba(37,99,235,.32)}
.btn-primary:disabled{opacity:.55; cursor:progress; transform:none; box-shadow:none}
.btn-ghost{
  border:1px solid var(--line); background:transparent; color:var(--muted);
  padding:9px 14px; border-radius:10px; cursor:pointer; transition:all .15s;
}
.btn-ghost:hover{border-color:var(--brand); color:var(--brand)}
.status{font-size:12px;color:var(--muted)}
.status.busy{color:var(--brand)}
.status.bad{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line));background:var(--ok-soft)}
.pill.ok .dot{background:var(--ok)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line));background:var(--bad-soft)}
.pill.bad .dot{background:var(--bad)}

.empty{
  border:1px dashed var(--line); border-radius:var(--radius); padding:56px 24px;
  text-align:center; color:var(--muted);
}
.empty svg{opacity:.45;margin-bottom:10px}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}

.banner{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:10px 12px; margin-bottom:12px; font-size:12px; color:var(--muted);
  background:color-mix(in srgb,var(--bg) 55%,transparent);
}
.banner.degraded{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,var(--line));color:var(--warn)}
.banner .sep{color:var(--line)}
.mono{font-family:var(--mono)}

.profile{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:12px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.tag b{color:var(--ink);font-weight:600}

.rec{
  border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
  margin-bottom:12px; background:var(--panel); transition:border-color .15s, box-shadow .15s;
}
.rec:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line)); box-shadow:var(--shadow)}
.rec-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rank{
  width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-weight:800;font-size:13px;background:var(--brand-soft);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);
}
.rec-head .model{font-weight:700;font-size:15px;font-family:var(--mono)}
.rec-head .grow{flex:1}
.score{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:999px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#2563eb)}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.metric{font-size:12px;padding:2px 8px;border-radius:7px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.metric b{color:var(--ink);font-weight:600}
.metric.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line));background:var(--warn-soft)}
.metric.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line));background:var(--ok-soft)}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.reasons li{font-size:13px;padding-left:2px}

details.raw{margin-top:14px}
details.raw summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600;user-select:none}
pre.raw-pre{
  margin:10px 0 0; padding:14px; border-radius:var(--radius-sm);
  background:#0f172a; color:#e2e8f0; overflow:auto; max-height:420px;
  font-family:var(--mono); font-size:12px; line-height:1.55;
}
.err-card{border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));background:var(--bad-soft);border-radius:var(--radius);padding:16px}
.err-card h3{margin:0 0 6px;color:var(--bad);font-size:15px}
.err-card .rid{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;word-break:break-all}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">MR</div>
    <div>
      <h1>Model Recommender Debug</h1>
      <p>硬规则过滤 → Jev 语义判断 → 加权融合 · 调试控制台</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="health" class="pill"><span class="dot"></span>连接中…</span>
    <button id="btn-clear" class="btn-ghost" type="button">清空结果</button>
  </div>
</header>

<main class="layout">
  <section class="panel request-panel" aria-label="请求配置">
    <div class="panel-head">
      <h2>请求</h2>
      <div class="presets" role="group" aria-label="示例请求">
        <button class="chip" data-preset="code" type="button">代码调试</button>
        <button class="chip" data-preset="simple" type="button">简单问答</button>
        <button class="chip" data-preset="vision" type="button">带图片</button>
      </div>
    </div>

    <label class="field-label" for="req">原始请求体 <span class="hint">OpenAI / Claude 风格,原样放入 <code>request</code></span></label>
    <textarea id="req" spellcheck="false" aria-label="原始请求体 JSON"></textarea>

    <div class="grid2">
      <label class="field">top_k
        <input id="topk" type="number" min="1" max="50" value="5">
      </label>
      <label class="field">locale
        <select id="locale">
          <option value="zh">zh 中文理由</option>
          <option value="en">en English reasons</option>
        </select>
      </label>
    </div>

    <details class="section" open>
      <summary>约束 <span class="hint">全部可选</span></summary>
      <div class="grid2">
        <label class="field">预算上限 $/M
          <input id="maxprice" type="number" step="0.01" min="0" placeholder="不限">
        </label>
        <label class="field checkbox"><input id="costsensitive" type="checkbox"> 成本敏感</label>
      </div>
      <label class="field">require_tags
        <input id="reqtags" type="text" placeholder="tools,vision">
      </label>
      <div class="grid2">
        <label class="field">vendor_allow
          <input id="allow" type="text" placeholder="openai,anthropic">
        </label>
        <label class="field">vendor_deny
          <input id="deny" type="text" placeholder="gemini">
        </label>
      </div>
      <label class="field checkbox"><input id="debug" type="checkbox"> include_debug <span class="hint">附带发送的问题与原始答案</span></label>
    </details>

    <details class="section">
      <summary>鉴权 <span class="hint">仅当服务配置了 token 时需要</span></summary>
      <label class="field">Bearer token
        <input id="token" type="password" autocomplete="off" placeholder="未启用鉴权可留空">
      </label>
      <p class="hint" style="margin:8px 0 0">token 只保存在本机 localStorage,不会写入服务端。</p>
    </details>

    <div class="actions">
      <button id="go" class="btn-primary" type="button">获取推荐</button>
      <button id="copy-req" class="btn-ghost" type="button">复制信封</button>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </div>
  </section>

  <section class="panel result-panel" aria-label="推荐结果">
    <div class="panel-head">
      <h2>结果</h2>
      <span id="timing" class="hint"></span>
    </div>
    <div id="out">
      <div class="empty">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M4 7h16M4 12h10M4 17h7" stroke-linecap="round"/>
          <circle cx="18.5" cy="16.5" r="2.5"/>
        </svg>
        <b>还没有结果</b>
        在左侧填写请求(或点一个示例),然后点「获取推荐」。
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var reqEl = $("req");
  var outEl = $("out");
  var statusEl = $("status");
  var timingEl = $("timing");
  var goBtn = $("go");
  var healthEl = $("health");

  var PRESETS = {
    code: {
      model: "gpt-5.4",
      messages: [
        { role: "system", content: "You are a helpful coding assistant." },
        { role: "user", content: "帮我修复这段 Rust 代码的编译错误:\n```rust\nfn main() { let x = 1 }\n```\n报错: error[E0308] mismatched types" }
      ],
      max_tokens: 4096
    },
    simple: {
      model: "gpt-5.4-mini",
      messages: [ { role: "user", content: "用三句话解释什么是向量数据库。" } ],
      max_tokens: 512
    },
    vision: {
      model: "gemini-3.7-flash",
      messages: [ { role: "user", content: [
        { type: "text", text: "这张图里是什么?请用中文简要描述。" },
        { type: "image_url", image_url: { url: "https://example.com/demo.png" } }
      ] } ],
      max_tokens: 1024
    }
  };

  // ---------- helpers ----------
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function fmt(v, digits) {
    if (v === null || v === undefined) return "—";
    if (typeof v === "number") return Number.isInteger(v) ? String(v) : v.toFixed(digits === undefined ? 3 : digits);
    return String(v);
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function setStatus(text, cls) {
    statusEl.textContent = text || "";
    statusEl.className = "status" + (cls ? " " + cls : "");
  }
  function pct(x) {
    var n = Number(x);
    if (!isFinite(n)) return 0;
    return Math.max(0, Math.min(1, n)) * 100;
  }

  // ---------- init ----------
  reqEl.value = JSON.stringify(PRESETS.code, null, 2);
  $("token").value = localStorage.getItem("rec_token") || "";
  $("token").addEventListener("change", function (e) {
    try { localStorage.setItem("rec_token", e.target.value); } catch (_) {}
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-preset]"), function (btn) {
    btn.addEventListener("click", function () {
      var key = btn.getAttribute("data-preset");
      reqEl.value = JSON.stringify(PRESETS[key], null, 2);
      setStatus("已载入示例:" + btn.textContent);
    });
  });

  $("btn-clear").addEventListener("click", function () {
    clear(outEl);
    outEl.appendChild(emptyState());
    timingEl.textContent = "";
    setStatus("");
  });

  $("copy-req").addEventListener("click", function () {
    var body;
    try { body = buildEnvelope(); } catch (e) { setStatus("请求体不是合法 JSON", "bad"); return; }
    copyText(JSON.stringify(body, null, 2), "信封已复制");
  });

  reqEl.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); run(); }
  });

  // health pill
  fetch("/healthz", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function () { return fetch("/readyz", { cache: "no-store" }); })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d) {
      healthEl.className = "pill ok";
      healthEl.innerHTML = "";
      healthEl.appendChild(el("span", "dot"));
      healthEl.appendChild(document.createTextNode("在线 · " + (d.models || 0) + " 个模型"));
    })
    .catch(function () {
      healthEl.className = "pill bad";
      healthEl.innerHTML = "";
      healthEl.appendChild(el("span", "dot"));
      healthEl.appendChild(document.createTextNode("服务不可用"));
    });

  function emptyState() {
    var box = el("div", "empty");
    box.innerHTML =
      '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">' +
      '<path d="M4 7h16M4 12h10M4 17h7" stroke-linecap="round"/><circle cx="18.5" cy="16.5" r="2.5"/></svg>' +
      "<b>还没有结果</b>在左侧填写请求(或点一个示例),然后点「获取推荐」。";
    return box;
  }

  function csv(id) {
    return $(id).value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function buildEnvelope() {
    var requestBody = JSON.parse(reqEl.value);
    var constraints = {};
    var maxp = $("maxprice").value;
    var cs = $("costsensitive").checked;
    if (maxp !== "") {
      constraints.budget = { max_input_price_per_mtok: Number(maxp), cost_sensitive: cs };
    } else if (cs) {
      constraints.budget = { cost_sensitive: true };
    }
    var rt = csv("reqtags"); if (rt.length) constraints.require_tags = rt;
    var al = csv("allow"); if (al.length) constraints.vendor_allow = al;
    var dn = csv("deny"); if (dn.length) constraints.vendor_deny = dn;

    var options = {
      top_k: Number($("topk").value) || 5,
      locale: $("locale").value
    };
    if ($("debug").checked) options.include_debug = true;

    return { request: requestBody, constraints: constraints, options: options };
  }

  function copyText(text, msg) {
    var done = function () { setStatus(msg || "已复制"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { setStatus("复制失败", "bad"); });
    } else {
      var t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch (_) { setStatus("复制失败", "bad"); }
      document.body.removeChild(t);
    }
  }

  // ---------- run ----------
  function run() {
    var envelope;
    try {
      envelope = buildEnvelope();
    } catch (e) {
      setStatus("请求体不是合法 JSON: " + e.message, "bad");
      return;
    }

    var headers = { "content-type": "application/json" };
    var tok = $("token").value.trim();
    if (tok) headers["authorization"] = "Bearer " + tok;

    goBtn.disabled = true;
    setStatus("请求中…", "busy");
    timingEl.textContent = "";
    var t0 = performance.now();

    var opts = { method: "POST", headers: headers, body: JSON.stringify(envelope) };
    if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) {
      opts.signal = AbortSignal.timeout(30000);
    }

    fetch("/v1/recommend", opts)
      .then(function (res) {
        return res.text().then(function (text) {
          var data = null;
          try { data = JSON.parse(text); } catch (_) {}
          return { res: res, text: text, data: data };
        });
      })
      .then(function (r) {
        var ms = Math.round(performance.now() - t0);
        if (!r.res.ok || !r.data) {
          renderError(r.res.status, r.data, r.text, ms);
          return;
        }
        timingEl.textContent = ms + " ms";
        setStatus("完成(" + ms + " ms)");
        renderResponse(r.data);
      })
      .catch(function (e) {
        var msg = e && e.name === "TimeoutError" ? "请求超时(30s)" : (e && e.message ? e.message : String(e));
        renderError(0, null, msg, Math.round(performance.now() - t0));
      })
      .then(function () {
        goBtn.disabled = false;
      });
  }

  goBtn.addEventListener("click", run);

  // ---------- rendering ----------
  function renderError(status, data, text, ms) {
    clear(outEl);
    setStatus("请求失败" + (status ? "(HTTP " + status + ")" : ""), "bad");
    timingEl.textContent = ms ? ms + " ms" : "";

    var card = el("div", "err-card");
    var title = el("h3");
    title.textContent = "请求失败" + (status ? " · HTTP " + status : "");
    card.appendChild(title);

    if (data && typeof data === "object") {
      if (data.error) card.appendChild(el("div", "mono", String(data.error) + (data.message ? ": " + data.message : "")));
      else card.appendChild(el("div", "mono", JSON.stringify(data)));
      if (data.request_id) card.appendChild(el("div", "rid", "request_id: " + data.request_id));
    } else {
      card.appendChild(el("div", "mono", String(text || "").slice(0, 2000)));
    }
    outEl.appendChild(card);
  }

  function renderResponse(data) {
    clear(outEl);

    // meta banner
    var meta = data.meta || {};
    var banner = el("div", "banner" + (data.degraded ? " degraded" : ""));
    function addSep() { banner.appendChild(el("span", "sep", "·")); }
    banner.appendChild(el("span", null, "backend "));
    banner.appendChild(el("span", "mono", meta.backend || "—"));
    addSep();
    banner.appendChild(el("span", null, "latency " + fmt(meta.latency_ms) + " ms"));
    addSep();
    banner.appendChild(el("span", null, "cache " + (meta.cache_hit ? "hit" : "miss")));
    addSep();
    banner.appendChild(el("span", null, "catalog "));
    banner.appendChild(el("span", "mono", meta.catalog_version || "—"));
    addSep();
    banner.appendChild(el("span", null, "weights "));
    banner.appendChild(el("span", "mono", meta.weights_version || "—"));
    if (meta.usage) {
      addSep();
      banner.appendChild(el("span", null, "usage " + fmt(meta.usage.input_tokens) + " / " + fmt(meta.usage.output_tokens)));
    }
    if (data.degraded) {
      banner.appendChild(el("span", "tag", "降级:" + (meta.degraded_reason || "yes")));
    }
    if (meta.partial_answers && meta.partial_answers.length) {
      banner.appendChild(el("span", "tag", "partial:" + meta.partial_answers.join(", ")));
    }
    if (meta.filtered && meta.filtered.length) {
      banner.appendChild(el("span", "tag", "filtered:" + meta.filtered.map(function (f) { return f.rule + "×" + f.count; }).join(", ")));
    }
    outEl.appendChild(banner);

    // profile
    var p = data.profile;
    if (p) {
      var prof = el("div", "profile");
      function tag(k, v) {
        var t = el("span", "tag");
        t.appendChild(document.createTextNode(k + " "));
        t.appendChild(el("b", null, v));
        prof.appendChild(t);
      }
      tag("task", p.task_type == null ? "—" : p.task_type);
      tag("difficulty", fmt(p.difficulty, 2));
      tag("frontier", fmt(p.frontier_needed, 2));
      tag("est_tokens", fmt(p.est_tokens));
      tag("tools", p.tools_count > 0 ? p.tools_count : "0");
      tag("images", p.has_images ? "yes" : "no");
      tag("json_mode", p.json_mode ? "yes" : "no");
      if (p.locale_hint) tag("locale", p.locale_hint);
      if (p.task_hints && p.task_hints.length) tag("hints", p.task_hints.join(" / "));
      outEl.appendChild(prof);
    }

    // recommendations
    var recs = data.recommendations || [];
    if (!recs.length) {
      var none = el("div", "empty");
      none.appendChild(el("b", null, "没有可推荐的模型"));
      none.appendChild(document.createTextNode("可能是约束过严(见上方 filtered 计数)。"));
      outEl.appendChild(none);
    }
    recs.forEach(function (r) { outEl.appendChild(recCard(r, data.degraded)); });

    // raw JSON
    var det = el("details", "raw");
    var sum = el("summary", null, "原始 JSON");
    det.appendChild(sum);
    var pre = el("pre", "raw-pre");
    pre.textContent = JSON.stringify(data, null, 2);
    det.appendChild(pre);
    var copyBtn = el("button", "btn-ghost", "复制响应");
    copyBtn.type = "button";
    copyBtn.style.marginTop = "8px";
    copyBtn.addEventListener("click", function () {
      copyText(JSON.stringify(data, null, 2), "响应已复制");
    });
    det.appendChild(copyBtn);
    outEl.appendChild(det);
  }

  function recCard(r, degraded) {
    var bd = r.breakdown || {};
    var card = el("article", "rec");

    var head = el("div", "rec-head");
    var rank = el("div", "rank", "#" + fmt(r.rank));
    head.appendChild(rank);
    head.appendChild(el("div", "model", r.model));
    head.appendChild(el("div", "grow"));
    head.appendChild(el("div", "score", fmt(r.score)));
    card.appendChild(head);

    var bar = el("div", "bar");
    var fill = el("i");
    fill.style.width = pct(r.score) + "%";
    bar.appendChild(fill);
    card.appendChild(bar);

    var metrics = el("div", "metrics");
    function metric(label, value, cls) {
      var m = el("span", "metric" + (cls ? " " + cls : ""));
      if (label) m.appendChild(document.createTextNode(label + " "));
      m.appendChild(el("b", null, value));
      metrics.appendChild(m);
    }
    metric("confidence", r.confidence === null || r.confidence === undefined ? "null" : fmt(r.confidence), r.low_confidence ? "warn" : "");
    if (r.low_confidence) metric("", "低置信", "warn");
    if (bd.quality_fit !== null && bd.quality_fit !== undefined) metric("quality", fmt(bd.quality_fit), "ok");
    if (bd.cost_fit !== null && bd.cost_fit !== undefined) metric("cost", fmt(bd.cost_fit), "ok");
    if (bd.weights) metric("weights", fmt(bd.weights.quality_fit, 2) + " / " + fmt(bd.weights.cost_fit, 2));
    if (bd.penalty !== null && bd.penalty !== undefined) metric("penalty", fmt(bd.penalty));
    if (bd.coarse) metric("coarse", fmt(bd.coarse.tag_overlap, 2) + " / " + fmt(bd.coarse.price_score, 2));
    card.appendChild(metrics);

    if (bd.rule_hits && bd.rule_hits.length) {
      var hits = el("div", "metrics");
      bd.rule_hits.forEach(function (h) {
        var chip = el("span", "metric ok", h);
        hits.appendChild(chip);
      });
      card.appendChild(hits);
    }

    if (r.reasons && r.reasons.length) {
      var ul = el("ul", "reasons");
      r.reasons.forEach(function (x) { ul.appendChild(el("li", null, x)); });
      card.appendChild(ul);
    }

    return card;
  }
})();
</script>
</body>
</html>
